# GADMO on Render (https://render.com/docs/blueprint-spec), on Render's FREE plans: a pilot
# for demos that costs nothing. Render → New → Blueprint → pick this repository; Render
# creates everything below and asks for the values marked `sync: false`. Guide: docs/DEPLOY.md.
#
# Free plan limits: services sleep after 15 minutes without visits (the next visit takes
# about a minute to wake them), the free database is deleted after 30 days, and the free
# Key Value store loses its data on restart (only sign-in codes and limits live there).
# For launch, switch the plans to paid ones (docs/DEPLOY.md, "At launch").
#
# Pilot mode: SMS is off, the demo numbers 0700 000 0001-0099 sign in with DEMO_LOGIN_CODE,
# and payments use GADMO's test checkout (no money moves).

services:
  # The PWA (Next.js): the address people open.
  - type: web
    name: gadmo-web
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @gadmo/shared build && pnpm --filter @gadmo/web build
    startCommand: pnpm --filter @gadmo/web exec next start -p $PORT
    healthCheckPath: /offline
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # The API's address. Free services can't use Render's private network, so this is the
      # API's public address: change it if Render gives gadmo-api a different one.
      - key: API_URL
        value: https://gadmo-api.onrender.com

  # The API (NestJS). On the free plan it is a web service; people only ever use gadmo-web.
  - type: web
    name: gadmo-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @gadmo/shared build && pnpm --filter @gadmo/api build
    # Free plans have no pre-deploy step, so database changes run each time the API starts.
    # To wake quickly from sleep, the API then starts straight away while the service
    # catalogue and demo people are refreshed in the background (all safe to repeat).
    startCommand: >-
      cd apps/api && ./node_modules/.bin/tsx src/db/migrate.ts &&
      { (./node_modules/.bin/tsx src/db/seed.ts &&
      node -r @swc-node/register scripts/demo-data.ts || true) & } &&
      exec node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gadmo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gadmo-redis
          type: keyvalue
          property: connectionString
      # Secrets Render generates once (random 256-bit, base64) and keeps.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      # The address of gadmo-web, e.g. https://gadmo-web.onrender.com
      - key: WEB_ORIGIN
        sync: false
      - key: SMS_PROVIDER
        value: disabled
      # 6 digits that sign in the demo numbers only (e.g. 123456).
      - key: DEMO_LOGIN_CODE
        sync: false
      # The demo staff account (0700 000 0099): your email and a 12+ character password.
      - key: DEMO_STAFF_EMAIL
        sync: false
      - key: DEMO_STAFF_PASSWORD
        sync: false
      - key: PAYMENT_PROVIDER
        value: test
      # Every request reaches the API from gadmo-web, so the per-address limit on sign-in
      # codes is shared by all visitors: raised for the pilot.
      - key: OTP_IP_HOURLY_LIMIT
        value: '500'

  # Sign-in codes and rate limits.
  - type: keyvalue
    name: gadmo-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: gadmo-db
    databaseName: gadmo
    user: gadmo
    region: frankfurt
    plan: free
    postgresMajorVersion: '16'
    ipAllowList: []
