# Local development services only. Never use these credentials outside your machine.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: gadmo
      POSTGRES_PASSWORD: gadmo_local_only
      POSTGRES_DB: gadmo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gadmo']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  pgdata:
